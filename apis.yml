apis:
- name: AlphaGeo Data API
  description: >-
    Public REST API for programmatically accessing AlphaGeo climate risk scoring data for
    global locations and portfolios. Location-Level Data APIs (Scores/CRRI, Physical Risk,
    Resilience-adjusted Risk, Global Adaptation Layers Risk, Financial Impact) resolve by
    address, latitude/longitude, or uploaded asset_id; Portfolio APIs (Portfolio Scores,
    Institution Assets) aggregate across an institution's assets. All operations are GET and
    require an Authorization token; an Enterprise subscription is required for API access.
  humanURL: https://docs.alphageo.ai/for-developers/alphageo-data-api
