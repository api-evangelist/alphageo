aid: alphageo
name: Alphageo
description: >-
  AlphaGeo is an AI-powered geospatial predictive analytics company that quantifies climate
  risk and adaptation for real assets to guide resilient, future-proof investing. Its enterprise
  SaaS platform (AlphaGeo Explorer) and public REST Data API deliver location-level and
  portfolio-level climate risk scores, resilience-adjusted risk, physical hazard layers
  (heat stress, inland and coastal flooding, hurricanes, drought, wildfire), and financial
  impact metrics across CMIP6 emission scenarios (SSP245, SSP370, SSP585) and time horizons
  (2025, 2035, 2050, 2100). The Data API returns per-location scores by address, coordinates,
  or uploaded asset ID, and portfolio aggregates across an institution's assets. Backed by
  DCVC, AlphaGeo also ships a Snowflake Native App and an agentic AI co-pilot, "Darwin."
